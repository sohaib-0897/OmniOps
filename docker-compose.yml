services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: omniops-postgres
    restart: always
    environment:
      POSTGRES_USER: omniops
      POSTGRES_PASSWORD: omniops_secure_pass
      POSTGRES_DB: omniops_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniops -d omniops_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: omniops-backend:2026.09.05
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: omniops-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://omniops:${POSTGRES_PASSWORD:-omniops_secure_pass}@postgres:5432/omniops_db
      - SECRET_KEY=${SECRET_KEY:-omniops_compose_local_dev_secret_key_2026}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-False}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
      - GEMINI_VISION_MODEL=${GEMINI_VISION_MODEL:-gemini-3.8-flash}
      - GEMINI_TRANSCRIPTION_MODEL=${GEMINI_TRANSCRIPTION_MODEL:-gemini-3.5-transcribe}
      - LLM_PROVIDER=${LLM_PROVIDER:?set LLM_PROVIDER}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:4b}
      - OLLAMA_TIMEOUT_SECONDS=${OLLAMA_TIMEOUT_SECONDS:-90}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-openai}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-1536}
      - EMBEDDING_SCHEMA_DIMENSION=1536
      # Production requires an authenticated runner deployed outside this
      # Compose project. An empty URL intentionally fails closed.
      - SANDBOX_EXECUTION_MODE=remote
      - SANDBOX_RUNNER_URL=${SANDBOX_RUNNER_URL:-}
      - SANDBOX_RUNNER_TOKEN=${SANDBOX_RUNNER_TOKEN:-}
      - SANDBOX_IMAGE=${SANDBOX_IMAGE:-omniops-python-sandbox:2026.09.05}
    ports:
      - "8000:8000"
    command: ["sh", "-c", "alembic -c alembic.ini upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    volumes:
      - storage_data:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: omniops-frontend
    restart: always
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  pgdata:
  storage_data:
